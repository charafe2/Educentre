server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # Serve the prerendered Angular homepage at /. Prerendered public routes are
    # served from their own directory (…/index.html via $uri/); every other route
    # (login, tenant app, superadmin) falls back to the client shell (index.csr.html)
    # so Angular hydrates/routes cleanly instead of reusing the homepage HTML.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass_header Authorization;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    location /api/ {
        try_files $uri @laravel;
    }

    location ~ \.php$ {
        internal;
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass_header Authorization;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow";
        internal;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        include /etc/nginx/mime.types;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ~ /\. {
        deny all;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Serve robots.txt / sitemap.xml as real files only. try_files ... =404 stops
    # them ever falling through to the Angular SPA (which would bounce a crawler
    # to the homepage); default_type pins the correct content type.
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }
}
