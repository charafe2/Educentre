<div class="auth-shell">
  <div class="auth-card">

    <div class="brand-mark">
      <img src="/logo.png" alt="Moujtahid" class="brand-logo" />
      <span class="brand-name">Moujtahid</span>
    </div>

    <div class="form-header">
      <h1 class="form-title">Bon retour</h1>
      <p class="form-subtitle">Connectez-vous à votre espace d'administration</p>
    </div>

    @if (error()) {
      <div class="alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="form-group">
        <label class="form-label">Adresse e-mail</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            class="form-input"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@centre.ma"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            class="form-input"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pw" (click)="showPassword.update(v => !v)">
            <i class="fa-regular" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" [class.loading]="loading()" [disabled]="loading()">
        @if (loading()) {
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          Connexion en cours...
        } @else {
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          Se connecter
        }
      </button>
    </form>

    <p class="form-switch">
      <a routerLink="/forgot-password" class="form-link">Mot de passe oublié ?</a>
    </p>

  </div>
</div>
