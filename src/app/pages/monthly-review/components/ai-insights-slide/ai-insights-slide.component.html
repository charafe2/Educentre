<div class="slide-inner">
  <div class="slide-header">
    <div>
      <h2 class="slide-title">{{ 'monthlyReview.insights.title' | t }}</h2>
      <p class="slide-subtitle">{{ 'monthlyReview.insights.subtitle' | t: { month: monthLabel } }}</p>
    </div>
  </div>

  @if (insights().length === 0) {
    <div class="empty-state">
      <i class="fa-solid fa-chart-simple"></i>
      <p>{{ 'monthlyReview.insights.empty' | t }}</p>
    </div>
  } @else {
    <ul class="insight-list">
      @for (item of insights(); track item.text) {
        <li class="insight-row" [class]="'tone-' + item.tone">
          <span class="insight-icon"><i [class]="item.icon"></i></span>
          <span class="insight-text">{{ item.text }}</span>
        </li>
      }
    </ul>
  }
</div>
