<div class="sa-shell" [class.collapsed]="sidebarCollapsed()" [class.nav-open]="mobileNavOpen()">

  <div class="sa-scrim" (click)="mobileNavOpen.set(false)" aria-hidden="true"></div>

  <aside class="sa-rail" aria-label="Navigation super-admin">
    <div class="sa-rail-top">
      <div class="sa-brand">
        <span class="sa-brand-sigil" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M5.4 18V6h3.2l3.4 5.8L15.4 6h3.2v12h-2.5v-7.7l-3.2 5.2h-1.8l-3.2-5.2V18H5.4Z" />
          </svg>
        </span>
        <span class="sa-brand-copy">
          <span class="sa-brand-name">Moujtahid</span>
          <span class="sa-brand-kicker">Console plateforme</span>
        </span>
      </div>
      <button class="sa-rail-btn sa-collapse" (click)="sidebarCollapsed.update(v => !v)"
              [title]="sidebarCollapsed() ? 'Déplier la navigation' : 'Replier la navigation'" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 6 9 12l6 6" />
        </svg>
      </button>
    </div>

    <nav class="sa-nav">
      <p class="sa-nav-section">Pilotage</p>
      <a routerLink="/superadmin/dashboard" routerLinkActive="on" class="sa-nav-item" title="Vue d'ensemble" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 19.5h15" />
          <path d="M7.2 16V9.5" />
          <path d="M12 16V5.5" />
          <path d="M16.8 16v-4.5" />
        </svg>
        <span>Vue d'ensemble</span>
      </a>
      <a routerLink="/superadmin/clients" routerLinkActive="on" class="sa-nav-item" title="Centres" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20V8.6l7-4 7 4V20" />
          <path d="M9 20v-5h6v5" />
          <path d="M8.4 10.8h.1" />
          <path d="M12 10.8h.1" />
          <path d="M15.6 10.8h.1" />
        </svg>
        <span>Centres</span>
      </a>
      <a routerLink="/superadmin/invoices" routerLinkActive="on" class="sa-nav-item" title="Factures centres" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.2 4h9.6A1.8 1.8 0 0 1 18.6 5.8v14l-2.2-1.3-2.2 1.3-2.2-1.3-2.2 1.3-2.4-1.5V5.8A1.8 1.8 0 0 1 7.2 4Z" />
          <path d="M9.7 8.4h4.8" />
          <path d="M9.7 12h4.8" />
          <path d="M9.7 15.6h3" />
        </svg>
        <span>Factures</span>
      </a>
      <a routerLink="/superadmin/tickets" routerLinkActive="on" class="sa-nav-item" title="Tickets support" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z" />
        </svg>
        <span>Support</span>
      </a>

      <p class="sa-nav-section">Catalogue</p>
      <a routerLink="/superadmin/subjects" routerLinkActive="on" class="sa-nav-item" title="Matières" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.5 5.2h9.4a2.2 2.2 0 0 1 2.2 2.2v11.4H7.7a2.2 2.2 0 0 1-2.2-2.2V5.2Z" />
          <path d="M5.5 16.6h11.6" />
          <path d="M8.5 9h6" />
        </svg>
        <span>Matières</span>
      </a>
      <a routerLink="/superadmin/academic-levels" routerLinkActive="on" class="sa-nav-item" title="Niveaux scolaires" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8.5 12 4.5l8 4-8 4-8-4Z" />
          <path d="M7.2 10.4v4.6c0 1.4 2.1 2.6 4.8 2.6s4.8-1.2 4.8-2.6v-4.6" />
        </svg>
        <span>Niveaux</span>
      </a>
      <a routerLink="/superadmin/packages" routerLinkActive="on" class="sa-nav-item" title="Packages" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 4.2 7.6 4-7.6 4-7.6-4 7.6-4Z" />
          <path d="m4.4 12.1 7.6 4 7.6-4" />
          <path d="m4.4 15.8 7.6 4 7.6-4" />
        </svg>
        <span>Packages</span>
      </a>
      <a routerLink="/superadmin/accounts" routerLinkActive="on" class="sa-nav-item" title="Comptes super-admin" (click)="mobileNavOpen.set(false)">
        <svg class="sa-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.8 18.2 6v5.3c0 4-2.4 7.2-6.2 8.9-3.8-1.7-6.2-4.9-6.2-8.9V6L12 3.8Z" />
          <path d="M9.5 12.2 11.2 14l3.4-4" />
        </svg>
        <span>Comptes</span>
      </a>
    </nav>

    <div class="sa-rail-foot">
      <div class="sa-operator">
        <span class="sa-operator-mark">SA</span>
        <span class="sa-operator-copy">
          <span class="sa-operator-name">Super Admin</span>
          <span class="sa-operator-role">Accès plateforme</span>
        </span>
      </div>
      <button class="sa-rail-btn" (click)="logout()" title="Se déconnecter" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.5 5.5H6.8A1.8 1.8 0 0 0 5 7.3v9.4a1.8 1.8 0 0 0 1.8 1.8h2.7" />
          <path d="M14.5 8.2 18.3 12l-3.8 3.8" />
          <path d="M18 12H9.5" />
        </svg>
      </button>
    </div>
  </aside>

  <div class="sa-main">
    <header class="sa-topbar">
      <button class="sa-menu-btn" type="button" (click)="mobileNavOpen.update(v => !v)" aria-label="Ouvrir la navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>

      <p class="sa-trail">
        <span>Moujtahid</span>
        <span class="sa-trail-sep" aria-hidden="true">/</span>
        <span class="sa-trail-here">Super administration</span>
      </p>

      <div class="sa-topbar-right">
        <span class="sa-stamp">{{ today }}</span>
        <span class="sa-status" title="Liaison avec l'API plateforme">
          <span class="sa-status-dot"></span>
          API connectée
        </span>
      </div>
    </header>

    <main class="sa-content">
      <router-outlet />
    </main>
  </div>
</div>
