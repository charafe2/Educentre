<div class="sa-shell login">

  <div class="rule-field" aria-hidden="true"></div>

  <header class="topline">
    <div class="wordmark">
      <span class="sigil" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M5.4 18V6h3.2l3.4 5.8L15.4 6h3.2v12h-2.5v-7.7l-3.2 5.2h-1.8l-3.2-5.2V18H5.4Z" />
        </svg>
      </span>
      <span>Moujtahid</span>
    </div>
    <span class="restricted">Accès restreint</span>
  </header>

  <main class="stage">
    <section class="card">
      <span class="card-rule" aria-hidden="true"></span>

      <div class="card-head">
        <span class="kicker">Console plateforme</span>
        <h1>Super administration</h1>
        <p>Cette console gère tous les centres. Identifiez-vous pour continuer.</p>
      </div>

      @if (error()) {
        <div class="sa-alert">
          <i class="fa-solid fa-triangle-exclamation"></i>
          {{ error() }}
        </div>
      }

      <form (ngSubmit)="submit()">
        <label class="sa-field">
          <span>Adresse e-mail</span>
          <input
            class="sa-input"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="superadmin@moujtahid.ma"
            autocomplete="username"
          />
        </label>

        <label class="sa-field">
          <span>Mot de passe</span>
          <span class="pw">
            <input
              class="sa-input"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••••••"
              autocomplete="current-password"
            />
            <button type="button" class="pw-toggle" (click)="showPassword.update(v => !v)"
                    [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
              <i class="fa-regular" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
            </button>
          </span>
        </label>

        <button type="submit" class="submit" [disabled]="loading()">
          @if (loading()) {
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            Vérification…
          } @else {
            Ouvrir la console
            <i class="fa-solid fa-arrow-right"></i>
          }
        </button>
      </form>

      <p class="card-foot">
        <i class="fa-solid fa-lock"></i>
        Session chiffrée · chaque connexion est journalisée
      </p>
    </section>
  </main>

</div>
